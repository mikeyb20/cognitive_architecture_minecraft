# cargo-mutants config. Mutation testing breaks the code on purpose (flips
# operators, changes comparisons) and checks that some test fails each time.
#
# The exclusions below are "equivalent mutants": changes that cannot alter
# behaviour, so no test can ever catch them. Each is listed with the reason.
# Do not add an exclusion for a mutant that changes behaviour: write a test.
exclude_re = [
    # The trait's default `execute` is never called: `execute` only runs
    # the handler that `owns` the skill, and handlers that keep the default
    # (threats) own none.
    "replace Handler::execute -> Exec with Default::default\\(\\)",
    # The CLI's thread count: tables are the same whatever the count (the
    # runner orders results by job, pinned in `keeps_job_order_...` and
    # `..._replay_...` tests), and 0 is read as 1.
    "replace threads -> usize with [01]",
    # `delta > 0` vs `>= 0`: scaling a zero delta by (1 − D) is still zero.
    "replace > with >= in Curiosity::apply",
    # `choke_shift > 0` vs `>= 0`: a zero shift moves zero weight.
    "replace > with >= in Oracle::weights",
    # `adv < 0` vs `<= 0`: when adv = 0 the step is zero either way.
    "replace < with <= in Oracle::update",
    # `rng < p` vs `<= p`: differs only when the draw equals p exactly
    # (probability ~2^-24 per draw).
    "replace < with <= in kick_extremes",
    # Stuck thresholds (0.05, 0.05, 0.5 bits): `<` vs `<=` differs only when a
    # float lands exactly on the threshold, which these sums never produce.
    "replace < with <= in StuckDetector::is_stuck",
    # Pruning activations `> 1e-6` vs `>= 1e-6`: an item at exactly 1e-6 is
    # below anything that could reach the top-k.
    "replace > with >= in ThoughtMomentum::tick_n_inner",
    # Subconscious σ thresholds (weak below 2·σ_min, pruned below σ_min):
    # `<` vs `<=` differs only when a decayed strength lands exactly on the
    # threshold.
    "replace < with <= in Subconscious::visit",
    # Reinforce when usefulness > 0.5: usefulness is faded by ×0.99 before
    # the check, and no f32 times 0.99 gives exactly 0.5.
    "replace > with >= in reinforces",
    # Sim random draw `rng < p` vs `<= p`: differs only when a uniform f32
    # draw equals p exactly (probability ~2^-24 per draw).
    "replace < with <= in SimWorld::chance",
    # Brain random draw `rng < p` vs `<= p`: same as above.
    "replace < with <= in <impl RandomBool for R>::random_bool_f32",
    # TM co-activation links `top[i + 1..]` vs `top[i * 1..]`: the extra pair
    # is (a, a), and `MemoryStore::link` ignores self-links.
    "replace \\+ with \\* in Brain::recall",
    # `ScriptedPlayer::idle()` is defined as `Self::default()`.
    "replace ScriptedPlayer::idle -> Self with Default::default\\(\\)",
    # Speed gate `rate < gate` vs `<=`: a measured wall-clock rate never
    # equals the gate exactly.
    "replace < with <= in speed",
    # Bench B1 arming draw `rng < q` vs `<= q`: differs only when a random
    # f64 equals q exactly (probability ~2^-53 per draw).
    "replace < with <= in run_seed",
    # Bench B2 H2: the recovered share (after − floor) ÷ (first − floor) is
    # the same whatever tick the floor is read at, because h decays
    # geometrically; so moving `end_t` cannot change it.
    "replace - with [+/] in h2",
    # Bench B2 H4 loop guards: the cap (`n < MAX_SERIES` vs `<=`) is reached
    # only by a model whose response never halves, and `r > half` vs `>=`
    # differs only when a float response lands exactly on half its start.
    "replace < with <= in halving_counts",
    "replace > with >= in halving_counts",
]
