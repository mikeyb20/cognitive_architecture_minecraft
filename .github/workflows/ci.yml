name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p runner
      # The TypeScript contract is generated from host-api (debt D3); fail if
      # the checked-in copy in bot/src/generated is stale.
      - run: cargo test -q -p host-api --features ts
      - run: |
          if [ -n "$(git status --porcelain -- bot/src/generated)" ]; then
            git status --porcelain -- bot/src/generated
            echo "::error::bot/src/generated is stale; run 'cargo test -p host-api --features ts' and commit it"
            exit 1
          fi
      # Build step 4 gate: the brain runs at >= 5,000 world ticks/s (spec §21).
      - run: cargo run --release -q -p runner -- speed 20

  coverage:
    name: coverage (>= 95% of lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The runner's main() is a stub covered by an integration test, so the
      # whole workspace is measured.
      - run: cargo llvm-cov --workspace --fail-under-lines 95 --summary-only

  mutants:
    name: mutation test (changed code, batch ${{ matrix.shard }}/4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # Four batches run side by side, so one lost runner loses a quarter of
      # the run and the other batches still report.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # Run every test binary under a 4 GiB address-space cap. Some mutants
      # (e.g. a path-finding loop that never ends) allocate without limit;
      # with the cap the test aborts and the mutant counts as caught, instead
      # of the runner running out of memory and being shut down. rustc is
      # not affected: this only wraps the built test binaries.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --as=4294967296 --
      # Base the mutated diff is taken against. Normally the PR's base branch.
      MUTANTS_BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: git diff ${{ env.MUTANTS_BASE }}...HEAD > pr.diff
      # Breaks the lines this PR changed on purpose; fails if any change
      # survives every test. Equivalent mutants are listed in
      # .cargo/mutants.toml with reasons. Memory and disk are printed once a
      # minute alongside, so if the runner is lost the log shows what the
      # machine looked like just before.
      - name: cargo mutants
        run: |
          while true; do
            echo "[resources] $(date -u +%T) $(free -m | awk '/Mem/{print "mem_used_mb=" $3, "mem_avail_mb=" $7}') $(df -m / | awk 'NR==2{print "disk_free_mb=" $4}')"
            sleep 60
          done &
          cargo mutants --in-diff pr.diff --no-shuffle -j 2 --timeout 120 --shard ${{ matrix.shard }}/4

  bot:
    name: bot (tsc, tests, coverage, mutation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Unit tests with line, branch and function coverage floors. The thin
      # Mineflayer glue in src/mineflayer/ needs a live server and is covered
      # by the acceptance tests instead (spec §27 step 6).
      - run: npm test
      # Mutation testing on the TypeScript files this PR changed, as for Rust.
      - name: stryker (changed files)
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- src \
            | sed 's|^bot/||' | grep -E '\.ts$' | grep -vE '\.test(-util)?\.ts$|^src/generated/|^src/mineflayer/' | paste -sd, -)
          if [ -z "$files" ]; then echo "No mutable TypeScript changed."; exit 0; fi
          npx stryker run --mutate "$files"
