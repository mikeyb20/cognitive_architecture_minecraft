[package]
name = "host-api"
description = "World and Host traits plus the shared ontology. The brain sees only these types (spec §2)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
# Only for generating the TypeScript contract (debt D3); off in normal builds.
ts-rs = { workspace = true, optional = true }

[features]
# `cargo test -p host-api --features ts` writes bot/src/generated/*.ts.
ts = ["dep:ts-rs"]

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
