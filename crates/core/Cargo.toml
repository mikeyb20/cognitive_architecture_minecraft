[package]
name = "cognitive-core"
description = "The brain: Curiosity Architecture cognitive core. Pure and deterministic given a seed (spec Part B)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
host-api.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

# host-api is the brain's only allowed workspace dependency, but nothing uses
# it until build step 4 wires the brain to World/Host. Remove this ignore in
# that step, so cargo-machete checks it again.
[package.metadata.cargo-machete]
ignored = ["host-api"]
