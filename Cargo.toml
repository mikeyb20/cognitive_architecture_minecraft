[workspace]
resolver = "3"
members = [
    "crates/host-api",
    "crates/core",
    "crates/sim",
    "crates/baselines",
    "crates/llm",
    "crates/minecraft",
    "crates/runner",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mikeyb20/cognitive_architecture_minecraft"
rust-version = "1.85"

[workspace.dependencies]
host-api = { path = "crates/host-api" }
cognitive-core = { path = "crates/core" }
sim = { path = "crates/sim" }
minecraft = { path = "crates/minecraft" }
llm = { path = "crates/llm" }
serde = { version = "1", features = ["derive"] }
rand = { version = "0.9", default-features = false }
rand_chacha = "0.9"
proptest = "1"
ts-rs = "=12.0.1"
serde_json = "1"
ureq = "3.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Maintainability gates (docs/ARCHITECTURE.md). Limits are set in clippy.toml.
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
dbg_macro = "warn"
todo = "warn"
allow_attributes_without_reason = "warn"
